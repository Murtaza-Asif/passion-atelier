<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passion Atelier — We'll Be Right Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: oklch(0.08 0.012 280);
      --fg: oklch(0.98 0.005 280);
      --muted: oklch(0.65 0.015 280);
      --violet: oklch(0.62 0.22 285);
      --gradient: linear-gradient(135deg, oklch(0.55 0.22 295) 0%, oklch(0.65 0.22 270) 100%);
      --gradient-text: linear-gradient(120deg, oklch(0.98 0.005 280) 0%, oklch(0.75 0.18 295) 60%, oklch(0.70 0.22 265) 100%);
    }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Epilogue', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: clamp(0.875rem, 2vw, 1.25rem) clamp(1rem, 4vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: oklch(0.08 0.012 280 / 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid oklch(1 0 0 / 0.05);
    }
    .header img { height: clamp(24px, 4vw, 36px); width: auto; border-radius: 4px; }
    .badge {
      font-size: clamp(0.55rem, 1.2vw, 0.65rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--violet);
      padding: clamp(0.25rem, 0.8vw, 0.35rem) clamp(0.6rem, 1.5vw, 0.9rem);
      border: 1px solid oklch(0.62 0.22 285 / 0.2);
      border-radius: 999px;
      background: oklch(0.62 0.22 285 / 0.06);
    }

    /* ── Background orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .orb-1 { width: min(60vw, 600px); height: min(60vw, 600px); background: oklch(0.55 0.22 295 / 0.22); top: -15%; left: -10%; animation: orb 16s ease-in-out infinite; }
    .orb-2 { width: min(50vw, 500px); height: min(50vw, 500px); background: oklch(0.65 0.22 270 / 0.18); bottom: -15%; right: -8%; animation: orb 16s ease-in-out infinite -6s; }
    @keyframes orb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(5rem, 12vh, 7rem) clamp(1.25rem, 5vw, 3rem) clamp(2rem, 5vh, 3rem);
      position: relative;
      z-index: 10;
    }

    .logo {
      width: clamp(100px, 16vw, 170px);
      margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
    }
    .logo img { width: 100%; height: auto; display: block; border-radius: 10px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: clamp(0.35rem, 1vw, 0.5rem) clamp(0.75rem, 2vw, 1.2rem);
      background: oklch(0.62 0.22 285 / 0.08);
      border: 1px solid oklch(0.62 0.22 285 / 0.15);
      border-radius: 999px;
      font-size: clamp(0.6rem, 1.3vw, 0.75rem);
      letter-spacing: 0.06em;
      color: var(--violet);
      margin-bottom: clamp(1rem, 2.5vh, 1.5rem);
    }
    .pill svg { width: 14px; height: 14px; flex-shrink: 0; }

    .label {
      font-size: clamp(0.6rem, 1.2vw, 0.7rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--violet);
      margin-bottom: clamp(0.6rem, 1.5vh, 1rem);
    }

    h1 {
      font-family: 'Urbanist', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.8rem);
      letter-spacing: -0.04em;
      line-height: 1.08;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: clamp(0.75rem, 2vh, 1.25rem);
    }

    .desc {
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      line-height: 1.75;
      color: var(--muted);
      max-width: 500px;
      margin: 0 auto clamp(1.5rem, 4vh, 2.5rem);
    }

    /* ── Progress ── */
    .progress { width: 100%; max-width: 380px; margin: 0 auto clamp(1.5rem, 4vh, 2.5rem); }
    .progress-top { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .progress-top span { font-size: clamp(0.6rem, 1.1vw, 0.7rem); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .progress-top .pct { font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: clamp(0.7rem, 1.2vw, 0.8rem); color: var(--violet); }
    .bar { height: 3px; background: oklch(1 0 0 / 0.06); border-radius: 999px; overflow: hidden; }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--gradient);
      animation: barFill 5s 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes barFill { to { width: 65%; } }

    /* ── Buttons ── */
    .btns { display: flex; align-items: center; justify-content: center; gap: clamp(0.5rem, 1.5vw, 1rem); flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: clamp(0.7rem, 1.8vw, 0.9rem) clamp(1.4rem, 3vw, 2.2rem);
      font-family: 'Epilogue', sans-serif;
      font-weight: 500;
      font-size: clamp(0.78rem, 1.4vw, 0.88rem);
      letter-spacing: 0.02em;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-primary {
      color: oklch(0.98 0.005 280);
      background: var(--gradient);
      border: none;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, oklch(1 0 0 / 0.25) 50%, transparent 70%);
      background-size: 250% 100%;
      background-position: 200% 0;
      transition: background-position 0.6s;
    }
    .btn-primary:hover::after { background-position: -50% 0; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px -10px oklch(0.55 0.25 285 / 0.5); }
    .btn-primary span, .btn-primary svg { position: relative; z-index: 2; }

    .btn-ghost {
      color: var(--muted);
      background: transparent;
      border: 1px solid oklch(1 0 0 / 0.1);
    }
    .btn-ghost:hover { border-color: var(--violet); color: var(--fg); background: oklch(0.62 0.22 285 / 0.06); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 10;
      padding: clamp(1.25rem, 3vw, 2rem);
      text-align: center;
      border-top: 1px solid oklch(1 0 0 / 0.05);
      background: oklch(0.08 0.012 280 / 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .socials { display: flex; justify-content: center; gap: clamp(0.5rem, 1.5vw, 0.75rem); margin-bottom: clamp(0.75rem, 2vh, 1rem); }
    .socials a {
      width: clamp(36px, 7vw, 42px);
      height: clamp(36px, 7vw, 42px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid oklch(1 0 0 / 0.08);
      color: var(--muted);
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .socials a:hover { border-color: var(--violet); color: var(--violet); background: oklch(0.62 0.22 285 / 0.08); transform: translateY(-2px); }
    .socials a svg { width: 18px; height: 18px; }
    .footer-text { font-size: clamp(0.55rem, 1.1vw, 0.65rem); letter-spacing: 0.15em; text-transform: uppercase; color: oklch(1 0 0 / 0.15); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .btns { flex-direction: column; width: 100%; }
      .btn { width: 100%; justify-content: center; max-width: 260px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <header class="header">
    <img src="public/assets/images/logo.png" alt="Passion Atelier" />
    <span class="badge">Maintenance</span>
  </header>

  <main class="hero">
    <div class="logo">
      <img src="public/assets/images/logo.png" alt="Passion Atelier" />
    </div>

    <div class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
      <span>Thank you for visiting</span>
    </div>

    <p class="label">Under Maintenance</p>
    <h1>We'll Be Right<br>Back Soon</h1>
    <p class="desc">
      We're giving our website a quick tune-up to serve you better. Our premium unstitched fabrics will be back on display before you know it.
    </p>

    <div class="progress">
      <div class="progress-top">
        <span>Restoration progress</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>

    <div class="btns">
      <button class="btn btn-primary" onclick="location.reload()">
        <span>Refresh Status</span>
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10m0 0L9 4m4 4L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a href="/" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        <span>Back to Home</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="socials">
      <a href="mailto:hello@passionatelier.com" title="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" title="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://wa.me/" target="_blank" rel="noopener" title="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      </a>
    </div>
    <p class="footer-text">Passion Atelier — Unstitched Men's Fabrics</p>
  </footer>

  <script>
    const el = document.getElementById('pct');
    const target = 65, dur = 5000, start = performance.now() + 800;
    (function tick(now) {
      const t = now - start;
      if (t < 0) { requestAnimationFrame(tick); return; }
      const p = Math.min(t / dur, 1);
      el.textContent = Math.round((1 - Math.pow(1 - p, 4)) * target) + '%';
      if (p < 1) requestAnimationFrame(tick);
    })(performance.now());
  </script>
</body>
</html>
